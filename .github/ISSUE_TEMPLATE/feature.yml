name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read CONTRIBUTING.md §5 first — cloud sync, telemetry, a plugin system for the
        vault process, and new ciphers are all declined by design, not by oversight.
  - type: textarea
    attributes: { label: The problem, description: "What are you unable to do today?" }
    validations: { required: true }
  - type: textarea
    attributes: { label: Your idea }
  - type: dropdown
    attributes:
      label: Which product
      description: New features are built in V2. V1 (the legacy Node.js line) takes fixes only.
      options:
        - "V2 (Rust)"
        - "V1 (Node.js, legacy)"
        - "Both"
