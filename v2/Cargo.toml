[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/keystore",
    "crates/brokerd",
    "crates/cli",
    "crates/mcp",
]
# apps/desktop/src-tauri is its own workspace, deliberately outside this MSRV
# pin — see ADR-035 in docs/14_DECISIONS.md.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "2.0.0-beta.1"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
strip = true

# Argon2id at m = 256 MiB is the slow step in every test that unlocks a vault. Unoptimised it
# takes seconds per derivation, which put `cargo test --workspace` past GitHub's 20-minute job
# limit on build.yml's first run (35967163459). Compiling the KDF crates optimised in dev and
# test builds changes speed only — the same code, the same parameters, the same output.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
