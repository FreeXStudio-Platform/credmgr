[package]
name = "credmgr-cli"
description = "credmgr — the single-binary CLI, MCP server (`credmgr mcp`) and client to credmgrd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "credmgr"
path = "src/main.rs"

[lints]
workspace = true

[features]
# ADR-162: the Mac App Store flavour of the bundled CLI - group-container paths (credmgr-store's `mas`) and a
# refusal, with the way round, for the commands a sandboxed process cannot do (`main.rs::mas_limit`).
# Built only by `release-app.sh --mas`.
mas = ["credmgr-store/mas"]

[dependencies]
base64 = "0.22"
credmgr-core = { path = "../core", version = "2.0.0-rc.2" }
credmgr-keystore = { path = "../keystore", version = "2.0.0-rc.2" }
credmgr-mcp = { path = "../mcp", version = "2.0.0-rc.2" }
credmgr-store = { path = "../store", version = "2.0.0-rc.2" }
# `credmgr restore` opens a backup archive with its own passphrase (issue #36). That is
# the archive's wrap only: no vault data is opened here and no running vault is read.
secrecy = "0.10.3"
serde_json = "1"
# `--copy`: the clipboard clearer is handed the SHA-256 of the copied value, never the value (clip.rs).
sha2 = "0.10"

# ADR-148 addendum: `O_NOFOLLOW` / `O_NONBLOCK` for reading `CREDMGR.md` without following a link (the constants
# only; no unsafe code — `main.rs` keeps `#![forbid(unsafe_code)]`). Already in the lock through brokerd.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# ADR-061's `crates/cli/tests/vault_init.rs` needs `set_state_dir_for_test`
# to keep its fixture broker off the real machine's state directory — same
# `test-utils` feature `crates/brokerd`'s own tests already build with.
credmgr-brokerd = { path = "../brokerd", version = "2.0.0-rc.2", features = ["test-utils"] }
tempfile = "=3.15.0"
