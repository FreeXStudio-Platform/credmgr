# CredMgr Mac App Store edition - the identifiers Apple ties the build to (ADR-162).
#
# THIS IS THE ONLY PLACE THEY ARE WRITTEN. Everything else reads this file:
#   * crates/store/src/paths.rs and apps/desktop/src-tauri/src/vault_paths.rs (include_str!): the app-group
#     container that holds the vault, the socket and the state directory in the `mas` flavour;
#   * scripts/release-app.sh --mas: the rendered entitlements, the Tauri overlay's identifier, the embedded
#     Info.plist of the two standalone helpers, and the inspection;
#   * scripts/sign-notarise.sh --mas: the signing identifiers.
#
# OPERATOR DECISION PENDING (docs/26_PRODUCT_PLAN_2X.md §9 decision 4): the final bundle id and app-group id
# are not chosen. The values below are PLACEHOLDERS. XXXXXXXXXX has the length of a real Team ID (ten
# characters), so the socket-path budget computed with it is the real one. When the operator has chosen:
#   1. set MAS_TEAM_ID to the Apple Developer Team ID (ten upper-case letters and digits);
#   2. change MAS_BUNDLE_ID if the final bundle id differs (it must match the App Store Connect record);
#   3. change MAS_APP_GROUP_NAME only if a different short name is wanted (keep it short: 104-byte socket limit);
#   4. set MAS_IDS_FINAL=yes. `release-app.sh --mas --strict` refuses to pass until this line says yes.
# Format: KEY=VALUE, one per line, no quotes, no spaces around '='. Lines starting with '#' are comments.
MAS_TEAM_ID=XXXXXXXXXX
MAS_BUNDLE_ID=com.credmgr.desktop
MAS_APP_GROUP_NAME=credmgr
MAS_IDS_FINAL=no
