  <header class="k-head" style="flex:none;height:var(--header-h)">
    <button class="k-btn cm-hamburger" onClick="{{toggleRailOpen}}" style="border:none;padding:4px 6px" aria-label="menu">☰</button>
    <svg width="18" height="18" viewBox="0 0 24 24" stroke-linecap="square" style="color:var(--bone);flex:0 0 auto"><sc-if value="{{markKeep}}" hint-placeholder-val="{{true}}"><rect x="3.5" y="3.5" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="8" y="8" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="11" y="11" width="2" height="2" fill="currentColor" style="{{logoDotStyle}}"></rect></sc-if><sc-if value="{{markCells}}" hint-placeholder-val="{{false}}"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" style="{{logoDotStyle}}"></circle></sc-if><sc-if value="{{markNode}}" hint-placeholder-val="{{false}}"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="12" cy="12" r="3" fill="currentColor" style="{{logoDotStyle}}"></circle></sc-if><sc-if value="{{markSeal}}" hint-placeholder-val="{{false}}"><path d="M12 3 L19.8 7.5 V16.5 L12 21 L4.2 16.5 V7.5 Z" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M12 8 L15.5 10 V14 L12 16 L8.5 14 V10 Z" fill="none" stroke="currentColor" stroke-width="1.5"></path><rect x="11.1" y="11.1" width="1.8" height="1.8" fill="currentColor" style="{{logoDotStyle}}"></rect></sc-if></svg>
    <span class="cm-head-name" style="font-family:var(--f-mono);font-size:var(--fs-base);font-weight:var(--fw-label)">credmgr</span>
    <sc-if value="{{cosmStampShow}}" hint-placeholder-val="{{false}}"><span aria-label="milestone: {{cosmStampText}} entries" title="{{cosmStampText}} entries" style="font-family:var(--f-mono);font-size:var(--fs-xs);border:1px solid var(--hair-strong);padding:0 4px;line-height:16px;flex:none;color:var(--ash)">{{cosmStampText}}</span></sc-if>
    <sc-if value="{{cosmRing}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" title="supporter" style="width:7px;height:7px;border:1px solid var(--bone);border-radius:50%;display:inline-block;flex:0 0 auto"></span></sc-if>
    <div style="flex:1;min-width:0;display:flex;justify-content:center;position:relative">
      <input class="cm-searchinput" value="{{searchQ}}" onChange="{{onSearch}}" onFocus="{{onSearchFocus}}" placeholder="search…  /" style="width:min(420px,100%);min-width:0;background:var(--steel);font-family:var(--f-mono);font-size:var(--fs-base)" data-comment-anchor="search-bar">
      <sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}">
        <div class="cm-searchdrop" data-screen-label="S7 Search" style="position:absolute;top:38px;width:min(420px,100%);max-height:360px;background:var(--steel);border:1px solid var(--hair-strong);border-radius:var(--r-sm);box-shadow:0 8px 24px var(--scrim);z-index:60;overflow-y:auto">
          <sc-for list="{{searchRows}}" as="r" hint-placeholder-count="2">
            <button onClick="{{r.go}}" style="display:flex;width:100%;gap:8px;align-items:center;padding:8px 12px;border:0;background:none;color:var(--bone);cursor:pointer;font-family:var(--f-mono);font-size:var(--fs-base);text-align:left" style-hover="background:var(--steel-2)">
              <span style="color:var(--mute);flex:0 0 14px">{{r.glyph}}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{r.label}}</span><span style="margin-left:auto;color:var(--mute);font-size:var(--fs-xs)">{{r.meta}}</span>
            </button>
          </sc-for>
          <sc-if value="{{searchMoreShow}}" hint-placeholder-val="{{false}}"><div class="t-caption" style="padding:6px 12px;color:var(--mute)">+{{searchMoreCount}} more — refine your search</div></sc-if>
          <sc-if value="{{searchNone}}" hint-placeholder-val="{{false}}"><div class="k-empty" style="padding:16px">Nothing matches</div></sc-if>
        </div>
      </sc-if>
    </div>
    <button class="k-chip" data-state="ok" onClick="{{toggleVaultLock}}" style="cursor:pointer;background:none" title="⌘L locks" aria-label="lock the vault"><span style="{{lockGlyphStyle}}">○</span> unlocked</button>
    <sc-if value="{{pendingChipShow}}" hint-placeholder-val="{{false}}"><button class="k-chip" data-state="warn" onClick="{{openPending}}" style="cursor:pointer;background:none" title="entries written while locked wait here for your review">{{pendingChipLabel}}</button></sc-if>
    <span role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">{{pendingAnnounce}}</span>
    <div style="position:relative">
      <button class="k-btn cm-vaultmenu-btn" onClick="{{toggleVaultMenu}}" style="border:none;padding:4px 8px" aria-label="vault menu">⌄</button>
      <sc-if value="{{vaultMenuOpen}}" hint-placeholder-val="{{false}}">
        <div class="cm-vaultmenu" data-screen-label="S24 Vault menu" role="menu" style="position:absolute;right:0;top:32px;z-index:70;background:var(--steel);border:1px solid var(--hair-strong);border-radius:var(--r-sm);box-shadow:0 8px 24px var(--scrim);min-width:200px;padding:4px;display:flex;flex-direction:column">
          <sc-for list="{{vaultMenuItems}}" as="m" hint-placeholder-count="4">
            <button onClick="{{m.go}}" style="display:flex;justify-content:space-between;gap:16px;padding:6px 10px;border:0;background:none;color:var(--bone);cursor:pointer;font-family:var(--f-mono);font-size:var(--fs-sm);text-align:left;border-radius:var(--r-xs)" style-hover="background:var(--steel-2)"><span>{{m.label}}</span><span class="t-kbd">{{m.kbd}}</span></button>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <button class="k-btn" onClick="{{openHelp}}" style="border:none;padding:4px 8px;font-family:var(--f-mono);font-weight:var(--fw-label)" aria-label="help">?</button>
    <button class="k-btn" onClick="{{openSettings}}" style="border:none;padding:4px 8px" aria-label="settings">⚙</button>
  </header>
